name: Create Draft Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: Post title
        required: true
        type: string
      filename:
        description: Filename inside content/ (must end with .md)
        required: true
        type: string
      category:
        description: Optional category
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-post-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate inputs and create skeleton post
        id: create
        env:
          TITLE: ${{ github.event.inputs.title }}
          FILENAME: ${{ github.event.inputs.filename }}
          CATEGORY: ${{ github.event.inputs.category }}
        run: |
          set -euo pipefail

          if [[ "$FILENAME" != *.md ]]; then
            echo "filename must end with .md"
            exit 1
          fi

          if [[ "$FILENAME" == /* ]] || [[ "$FILENAME" == *".."* ]]; then
            echo "filename must be a safe relative path inside content/"
            exit 1
          fi

          TARGET_PATH="content/$FILENAME"
          TARGET_DIR="$(dirname "$TARGET_PATH")"

          if [[ -f "$TARGET_PATH" ]]; then
            echo "file already exists: $TARGET_PATH"
            exit 1
          fi

          mkdir -p "$TARGET_DIR"

          TODAY="$(date +%F)"

          {
            printf 'Title: %s\n' "$TITLE"
            printf 'Date: %s\n' "$TODAY"
            if [[ -n "$CATEGORY" ]]; then
              printf 'Category: %s\n' "$CATEGORY"
            else
              printf 'Category:\n'
            fi
            printf '\n'
          } > "$TARGET_PATH"

          STEM="$(basename "$FILENAME" .md)"
          SAFE_STEM="$(printf '%s' "$STEM" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$SAFE_STEM" ]]; then
            SAFE_STEM="post-${GITHUB_RUN_ID}"
          fi
          BRANCH_NAME="post/$TODAY-$SAFE_STEM"

          {
            printf 'target_path=%s\n' "$TARGET_PATH"
            printf 'branch_name=%s\n' "$BRANCH_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.create.outputs.branch_name }}
          delete-branch: true
          title: "New post: ${{ github.event.inputs.title }}"
          body: |
            This draft PR was generated by the manual Create Draft Post workflow.

            - File: `${{ steps.create.outputs.target_path }}`
            - Title: `${{ github.event.inputs.title }}`
            - Category: `${{ github.event.inputs.category }}`
          draft: true
          base: main
          commit-message: "Create post skeleton: ${{ steps.create.outputs.target_path }}"
          add-paths: |
            ${{ steps.create.outputs.target_path }}
