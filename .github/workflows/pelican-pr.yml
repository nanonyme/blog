name: Pull Request Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pelican dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pelican markdown

      - name: Build site
        run: make publish

      - name: Verify generated site
        run: test -f output/index.html

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: pelican-site-pr-${{ github.event.pull_request.number }}
          path: output
          retention-days: 7
